spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  main:
    allow-circular-references: true

stockpulse:
  commerce:
    strategy: RULE_BASED
  demand:
    spikeMultiplier: 3.0

llm:
  provider: ${LLM_PROVIDER:mock}
  api:
    key: ${LLM_API_KEY:}
  base:
    url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}

server:
  port: 8080

logging:
  level:
    com.stockpulse: DEBUG